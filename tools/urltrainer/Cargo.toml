[package]
name = "urltrainer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
flate2 = "1.0"
num_cpus = "1.16"
crossbeam-channel = "0.5"
idna = "1.0"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
url = "2.5"
zip = { version = "6.0", default-features = false, features = ["deflate"] }
zstd = "0.13"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.20"
